name: Production Quality Gate — Lambac Coffee Roastery

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.1'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # ============================================================================
  # 1. STATIC CODE ANALYSIS, SECRETS INSPECTION & LINTING
  # ============================================================================
  static_analysis_and_linting:
    name: 1. Static Analysis & Credential Protection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Leak Prevention Audit
        run: |
          echo "Scanning for hardcoded private keys or service account credentials..."
          ! grep -rn "BEGIN PRIVATE KEY" lib/ test/ || (echo "FAILED: Private key detected in source code!" && exit 1)
          ! grep -rn "FIREBASE_ADMIN_PRIVATE_KEY" lib/ test/ || (echo "FAILED: Firebase admin credential detected!" && exit 1)
          echo "Zero private keys found in codebase."

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

  # ============================================================================
  # 2. FLUTTER UNIT, WIDGET & INTEGRATION TEST SUITES
  # ============================================================================
  flutter_regression_tests:
    name: 2. Flutter Unit, Widget & Integration Regression
    needs: [static_analysis_and_linting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Core Test Suite (Unit & Widget)
        run: |
          flutter test --coverage \
            test/features/orders/ \
            test/features/pos/ \
            test/features/cart/ \
            test/features/chat/ \
            test/features/notifications/ \
            test/features/sales/ \
            test/features/products/ \
            test/features/auth/

      - name: Run Resilience & Failure Scenarios
        run: |
          flutter test test/features/resilience/production_failure_scenarios_test.dart

      - name: Run Security, Privacy & Reliability Quality Gates
        run: |
          flutter test \
            test/features/security/comprehensive_authorization_audit_test.dart \
            test/features/security/production_validation_hardening_test.dart \
            test/features/privacy/customer_privacy_lifecycle_test.dart \
            test/features/reliability/production_reliability_test.dart \
            test/features/monitoring/production_audit_monitoring_test.dart \
            test/features/disaster_recovery/firebase_disaster_recovery_test.dart \
            test/features/persistence/production_persistence_test.dart

  # ============================================================================
  # 3. FIREBASE SECURITY RULES EMULATOR SUITE
  # ============================================================================
  firebase_security_rules_emulator:
    name: 3. Firebase Security Rules (Emulator Suite)
    needs: [static_analysis_and_linting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: test/security_rules/package.json

      - name: Setup Java (Required for Firebase Local Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Security Rules Test Dependencies
        working-directory: test/security_rules
        run: npm install

      - name: Run Rules Tests against Firestore & Storage Emulators
        run: |
          firebase emulators:exec \
            --only firestore,storage \
            --project lambac-coffee-roastery-test \
            "npm --prefix test/security_rules test"

  # ============================================================================
  # 4. PRODUCTION RELEASE GATE
  # ============================================================================
  production_quality_gate:
    name: 4. Production Release Gate Certification
    needs: [flutter_regression_tests, firebase_security_rules_emulator]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Quality Gate Sign-Off
        run: |
          echo "==========================================================="
          echo "PRODUCTION QUALITY GATE PASSED CERTIFICATION"
          echo "All static analysis, unit/widget tests, resilience suites,"
          echo "and Firebase Emulator security rules tests PASSED."
          echo "Zero credential leaks detected."
          echo "Eligible for release artifact generation and rule deployment."
          echo "==========================================================="
